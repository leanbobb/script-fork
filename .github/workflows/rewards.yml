name: rewards
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
concurrency:
  group: rewards
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: sessions
          key: sessions-${{ github.run_id }}
          restore-keys: sessions-
      - run: npm run pre-build
      - run: sudo env PATH=$PATH npx patchright install-deps chromium
      - name: Write .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: printf '%s\n' "$ENV_FILE" > .env
      - name: Write config
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: jq '.headless=true | .webhook.discord.enabled=true | .webhook.discord.url=env.DISCORD_WEBHOOK_URL' config.example.json > config.json
      - run: npm run build
      - run: npm run start
      - name: Notify Discord
        if: always()
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\":\"Rewards run finished: ${{ job.status }}\"}" "$HOOK"
